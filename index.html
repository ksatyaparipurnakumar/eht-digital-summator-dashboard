<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EHT Digital Summator Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{
  /* Layout: fixed left rail of modules, sticky command bar, content in a 12-col grid of panels. */
  --bg:#eef1f4; --panel:#ffffff; --panel-2:#f6f8fa; --ink:#15212c; --muted:#596a7a; --line:#d5dde5;
  --accent:#1d5bb8; --accent-ink:#ffffff; --accent-soft:#e3ecf9;
  --pass:#1b7f47; --pass-soft:#e1f2e8; --warn:#9a6205; --warn-soft:#fbefd6; --fail:#c0262d; --fail-soft:#fbe3e3;
  --adv:#6c45bd; --adv-soft:#eee8fa; --grid:#e7ecf1;
  --font-display:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px; --shadow:0 1px 2px rgba(15,30,45,.06),0 2px 8px rgba(15,30,45,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c131a; --panel:#131d27; --panel-2:#182432; --ink:#e4ebf2; --muted:#93a4b5; --line:#263544;
    --accent:#5c9cff; --accent-ink:#06121f; --accent-soft:#1a2c45;
    --pass:#47c07c; --pass-soft:#14301f; --warn:#e2a93b; --warn-soft:#352a12; --fail:#ff6b6b; --fail-soft:#3a1719;
    --adv:#a78bfa; --adv-soft:#2a2142; --grid:#1d2a37; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c131a; --panel:#131d27; --panel-2:#182432; --ink:#e4ebf2; --muted:#93a4b5; --line:#263544;
  --accent:#5c9cff; --accent-ink:#06121f; --accent-soft:#1a2c45;
  --pass:#47c07c; --pass-soft:#14301f; --warn:#e2a93b; --warn-soft:#352a12; --fail:#ff6b6b; --fail-soft:#3a1719;
  --adv:#a78bfa; --adv-soft:#2a2142; --grid:#1d2a37; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px} h4{font-size:14px}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* shell */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.rail{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.brand b{font-family:var(--font-display);font-size:17px;display:block;line-height:1.2}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{padding:8px;display:flex;flex-direction:column;gap:1px}
.nav .sec{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:13.5px}
.nav a:hover{background:var(--panel-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a .cnt{margin-left:auto;font-size:11px;font-family:var(--font-mono);color:var(--muted)}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.rail-foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}

.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:10px 20px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:220px;max-width:520px}
.search input[type=search]{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:420px;overflow:auto;display:none}
.results.show{display:block}
.results button{display:block;width:100%;text-align:left;padding:8px 12px;border:0;background:none;border-bottom:1px solid var(--line);cursor:pointer}
.results button:hover,.results button:focus{background:var(--panel-2)}
.results .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bar .sp{flex:1}
.save{font-size:12px;color:var(--muted);white-space:nowrap}
.save.ok::before{content:"● ";color:var(--pass)} .save.local::before{content:"● ";color:var(--warn)} .save.busy::before{content:"● ";color:var(--accent)}

.view{padding:20px;display:flex;flex-direction:column;gap:16px;max-width:1360px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{color:var(--muted);max-width:75ch;margin-top:4px}

/* panels */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
@media (max-width:1100px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}.c3{grid-column:span 6}}
@media (max-width:640px){.c3{grid-column:span 12}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.panel>h3{margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel .sub{color:var(--muted);font-size:12.5px;margin:-6px 0 10px}

/* status */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em;border:1px solid transparent;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-pass{color:var(--pass);background:var(--pass-soft)} .st-pass::before{content:"✓";background:none;width:auto;height:auto;font-size:11px}
.st-fail{color:var(--fail);background:var(--fail-soft)} .st-fail::before{content:"✕";background:none;width:auto;height:auto;font-size:11px}
.st-warn{color:var(--warn);background:var(--warn-soft)} .st-warn::before{content:"!";background:none;width:auto;height:auto;font-size:11px}
.st-pend{color:var(--muted);background:var(--panel-2);border-color:var(--line)}
.st-info{color:var(--accent);background:var(--accent-soft)}
.st-adv{color:var(--adv);background:var(--adv-soft)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:4px;text-transform:uppercase;vertical-align:middle;border:1px solid}
.tag.SRC{color:var(--pass);border-color:currentColor}
.tag.ENG{color:var(--accent);border-color:currentColor}
.tag.ILL{color:var(--adv);border-color:currentColor}
.tag.TBC{color:var(--warn);border-color:currentColor;background:var(--warn-soft)}
.tag.RISK{color:#fff;background:var(--fail);border-color:var(--fail)}

.verdict{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:var(--r);border:2px solid}
.verdict .big{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:.02em}
.verdict.v-go{border-color:var(--pass);background:var(--pass-soft);color:var(--pass)}
.verdict.v-cgo{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.verdict.v-nogo{border-color:var(--fail);background:var(--fail-soft);color:var(--fail)}
.verdict.v-pend{border-color:var(--line);background:var(--panel-2);color:var(--muted)}
.verdict .why{color:var(--ink);font-size:13px;max-width:70ch}
.verdict .ico{font-size:30px;font-weight:700;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor;flex:none}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:7px;padding:10px 12px}
.kpi b{display:block;font-family:var(--font-mono);font-size:22px;font-weight:600}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.k-pass{border-left-color:var(--pass)} .kpi.k-fail{border-left-color:var(--fail)} .kpi.k-warn{border-left-color:var(--warn)} .kpi.k-info{border-left-color:var(--accent)}

.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative}
@media (max-width:760px){.stages{grid-template-columns:1fr 1fr;row-gap:10px}}
.stage{padding:10px 12px;border:1px solid var(--line);background:var(--panel-2);margin-right:-1px}
.stage:first-child{border-radius:7px 0 0 7px}.stage:last-child{border-radius:0 7px 7px 0}
.stage .n{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stage b{display:block;font-family:var(--font-display);font-size:15px;margin:2px 0 6px}
.stage select{width:100%}
.stage.s-done{border-top:3px solid var(--pass)} .stage.s-prog{border-top:3px solid var(--accent)} .stage.s-fail{border-top:3px solid var(--fail)} .stage.s-none{border-top:3px solid var(--line)}

.gates{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:900px){.gates{grid-template-columns:1fr 1fr}}
.gate{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--panel)}
.gate.g-pass{border-color:var(--pass);box-shadow:inset 0 3px 0 var(--pass)}
.gate.g-fail{border-color:var(--fail);box-shadow:inset 0 3px 0 var(--fail);background:var(--fail-soft)}
.gate.g-pend{box-shadow:inset 0 3px 0 var(--line)}
.gate .gid{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.gate b{font-family:var(--font-display);font-size:15px;display:block;margin:2px 0 8px}
.gate .dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.dot{font-family:var(--font-mono);font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer}
.dot.PASS{background:var(--pass-soft);color:var(--pass);border-color:var(--pass)}
.dot.FAIL{background:var(--fail-soft);color:var(--fail);border-color:var(--fail)}
.dot.NA{opacity:.6}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:7px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--panel-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--panel-2)}
td.num,th.num{text-align:right}

/* forms */
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;min-width:0}
textarea{width:100%;min-height:64px;resize:vertical}
input[type=number]{font-family:var(--font-mono)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f input,label.f select,label.f textarea{color:var(--ink);font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:120px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 11px;cursor:pointer;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}

.err{color:var(--fail);font-size:12.5px;background:var(--fail-soft);padding:6px 10px;border-radius:6px;border-left:3px solid var(--fail)}
.warnbox{background:var(--warn-soft);border-left:3px solid var(--warn);padding:8px 12px;border-radius:6px;font-size:13px}
.critbox{background:var(--fail-soft);border-left:4px solid var(--fail);padding:10px 12px;border-radius:6px;font-size:13px;color:var(--ink)}
.critbox b{color:var(--fail)}
.okbox{background:var(--pass-soft);border-left:3px solid var(--pass);padding:8px 12px;border-radius:6px;font-size:13px}
.infobox{background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 12px;border-radius:6px;font-size:13px}

/* result readouts */
.readout{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ro{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.ro span{font-size:11.5px;color:var(--muted);display:block}
.ro b{font-family:var(--font-mono);font-size:17px;font-weight:600}
.ro.bad{background:var(--fail-soft);border-color:var(--fail)} .ro.bad b{color:var(--fail)}
.ro.good{background:var(--pass-soft);border-color:var(--pass)} .ro.good b{color:var(--pass)}

/* cards lists */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card .n{font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--accent)}
.qcard{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.qcard>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.qcard>summary::-webkit-details-marker{display:none}
.qcard>summary .qid{font-family:var(--font-mono);font-weight:600;color:var(--accent);min-width:34px}
.qcard>summary .qt{flex:1;font-weight:500}
.qcard[open]>summary{border-bottom:1px solid var(--line);background:var(--panel-2)}
.qbody{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.qbody{grid-template-columns:1fr}}
.kb{display:flex;flex-direction:column;gap:8px;font-size:13px}
.kb dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kb dd{margin:0}
.know{background:var(--accent-soft);border-radius:6px;padding:8px 10px}
.redf{background:var(--fail-soft);border-radius:6px;padding:8px 10px}
.flag-bb{display:inline-flex;gap:6px;align-items:center;color:#fff;background:var(--fail);padding:3px 9px;border-radius:5px;font-size:12px;font-weight:600}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,12,20,.45);z-index:40;display:none}
.scrim.show{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(760px,100%);background:var(--panel);z-index:41;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer.show{transform:none}
.drawer header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer header h2{flex:1}
.drawer .body{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.flow{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13.5px}
.flow dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding-top:2px}
.flow dd{margin:0}
@media (max-width:560px){.flow{grid-template-columns:1fr}}
.evid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.evid label{display:flex;gap:7px;align-items:center;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px}
.evid label.crit{border-left:3px solid var(--fail)}
.ev-g{color:var(--pass)} .ev-a{color:var(--warn)} .ev-r{color:var(--fail)}

/* svg charts */
svg.chart{width:100%;height:auto;display:block}
svg text{fill:var(--muted);font-family:var(--font-body);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

.qd{cursor:pointer}
.qd:hover rect{opacity:.9}
.wrong{border-left:4px solid var(--fail);padding:8px 12px;background:var(--fail-soft);border-radius:6px}
.right{border-left:4px solid var(--pass);padding:8px 12px;background:var(--pass-soft);border-radius:6px}
.term{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer;font:inherit}

/* depth */
body.d1 .dl2, body.d1 .dl3, body.d1 .dl4, body.d2 .dl3, body.d2 .dl4, body.d3 .dl4{display:none}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:7px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto;padding:6px}
  .nav .sec,.rail-foot{display:none}
  .nav a{white-space:nowrap}
  .brand{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{.rail,.bar{display:none}.app{grid-template-columns:1fr}.panel{box-shadow:none}}

.libdeck{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid transparent;background:none;border-radius:6px;padding:6px;cursor:pointer;width:100%}
.libdeck:hover{background:var(--panel-2)} .libdeck.on{background:var(--accent-soft);border-color:var(--accent)}
.libdeck img{width:72px;height:40px;object-fit:cover;border-radius:3px;border:1px solid var(--line);flex:none}
.libdeck span{display:flex;flex-direction:column;font-size:12.5px;line-height:1.3}
.c9{grid-column:span 9}@media (max-width:1100px){.c9,.c3{grid-column:span 12}}
.slidebox{background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center}
.slidebox img{width:100%;height:100%;object-fit:contain;cursor:zoom-in}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.thumbs button{flex:none;border:2px solid transparent;border-radius:5px;padding:0;background:none;cursor:pointer;position:relative}
.thumbs button.on{border-color:var(--accent)}
.thumbs img{width:110px;height:62px;object-fit:cover;border-radius:3px;display:block}
.thumbs span{position:absolute;bottom:2px;right:4px;font-size:10px;background:rgba(0,0,0,.6);color:#fff;padding:0 4px;border-radius:3px}
.infcard{cursor:zoom-in;text-align:left;font:inherit;color:inherit}
.infcard img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
.nav button.nl{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;color:var(--ink);background:none;border:0;font-size:13.5px;text-align:left;cursor:pointer;width:100%}
.nav button.nl:hover{background:var(--panel-2)} .nav button.nl.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button.nl .cnt{margin-left:auto;font-size:11px;font-family:var(--font-mono);color:var(--muted)}
@media (max-width:900px){.nav button.nl{white-space:nowrap;width:auto}}
</style>
</head>

// ================= CALCULATION ENGINE (pure, deterministic) =================
const E = {
  hyp:(p,q)=>Math.sqrt(p*p+q*q),
  qFromPF(p,pf,lead){ if(!(pf>0&&pf<=1)) return NaN; const q=Math.abs(p)*Math.tan(Math.acos(pf)); return lead?-q:q; },
  // feeders: [{P,Q,MF,missing}] ; treat: 'net' | 'lag' | 'abs'
  vector(feeders,treat){
    let P=0,Q=0,scalar=0,missing=0;
    for(const f of feeders){
      if(f.missing){missing++;continue}
      const mf=(f.MF==null||f.MF==="")?1:+f.MF;
      const p=f.P*mf; let q=f.Q*mf;
      if(treat==="lag") q=Math.max(0,q);
      if(treat==="abs") q=Math.abs(q);
      P+=p;Q+=q;scalar+=E.hyp(p,q);
    }
    const S=E.hyp(P,Q);
    return {P,Q,S,PF:S?P/S:NaN,scalar,over:S?(scalar-S)/S*100:0,missing};
  },
  demand(kwh,minutes){ return kwh*60/minutes; },
  // blocks: [{P,Q}] totals per sub-block; win = sub-blocks per window
  windows(blocks,win){
    const fixed=[],slide=[];
    const avg=(a)=>{let p=0,q=0;for(const b of a){p+=b.P;q+=b.Q}return{P:p/a.length,Q:q/a.length,S:E.hyp(p/a.length,q/a.length)}};
    for(let i=0;i+win<=blocks.length;i+=win) fixed.push({i,...avg(blocks.slice(i,i+win))});
    for(let i=0;i+win<=blocks.length;i++) slide.push({i,...avg(blocks.slice(i,i+win))});
    return {fixed,slide};
  },
  phaseErr(pf,dmin,ev,ei,lead){
    const phi=Math.acos(pf), d=dmin*Math.PI/(180*60);
    const term=Math.tan(phi)*d*100*(lead?-1:1);
    return {term,total:(+ev)+(+ei)+term,tan:Math.tan(phi),rad:d};
  },
  uncS(P,Q,uPpct,uQpct){
    const S=E.hyp(P,Q), uP=Math.abs(P)*uPpct/100, uQ=Math.abs(Q)*uQpct/100;
    const u=Math.sqrt(Math.pow(P/S*uP,2)+Math.pow(Q/S*uQ,2));
    return {S,u,pct:u/S*100,uP,uQ};
  },
  rollover(oldR,newR,max){ return newR>=oldR ? newR-oldR : (max-oldR)+newR; },
  errPct(exp,meas){ const a=meas-exp; return {abs:a,pct:exp!==0?a/Math.abs(exp)*100:NaN}; },
  // minute-level clock offset simulation (Example 6 model, editable)
  clockSim(o){
    const res=[];
    for(let b=0;b<4;b++){
      let p=0,q=0;
      for(let m=0;m<15;m++){
        const t=b*15+m;
        const f1=(t>=o.a0&&t<o.a0+15)?[o.peakP,o.peakQ]:[o.baseP,o.baseQ];
        const r=t+o.off;
        const f2=(r>=o.b0&&r<o.b0+15)?[o.peakP,o.peakQ]:[o.baseP,o.baseQ];
        p+=f1[0]+f2[0];q+=f1[1]+f2[1];
      }
      res.push({P:p/15,Q:q/15,S:E.hyp(p/15,q/15)});
    }
    return res;
  }
};

function tRec(n){return ST.tests[n]||(ST.tests[n]={status:"PENDING",exp:"",meas:"",tol:"",unit:"",obs:"",oemr:"",action:"",retest:"Not required",date:"",ev:{}})}

function touch(){ST.last=new Date().toISOString();scheduleSave()}
function scheduleSave(){clearTimeout(saveTimer);setSave("busy","Saving…");saveTimer=setTimeout(doSave,900)}
let saving=false,dirty=false;
async function doSave(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(ST))}catch(e){}
  if(!DB||!UID){setSave("local",saveMode==="none"?"Not saved (storage unavailable)":"Saved in this browser");return}
  if(saving){dirty=true;return}
  saving=true;
  try{
    for(const [k,keys] of Object.entries(PARTS)){
      const o={};keys.forEach(x=>o[x]=ST[x]);
      await DB.collection("data/users/"+UID).doc("ws_"+k).set({j:JSON.stringify(o),at:ST.last||""});
    }
    setSave("ok","Saved to your account");
  }catch(e){setSave("local","Saved in this browser only (account save failed)")}
  saving=false; if(dirty){dirty=false;doSave()}
}
function setSave(cls,txt){const el=document.getElementById("save");if(el){el.className="save "+cls;el.textContent=txt}}
function merge(o){if(!o)return;for(const k of Object.keys(o)){if(k in ST)ST[k]=o[k]}}
function loadLocal(){try{const s=localStorage.getItem(LS_KEY);if(s){merge(JSON.parse(s));saveMode="local"}}catch(e){saveMode="none"}}
async function initDB(){
  try{
    if(!window.claude||!window.claude.use){setSave("local","Saved in this browser");return}
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user){setSave("local","Saved in this browser");return}
    const id=await user.id(); if(!id){setSave("local","Sign in to save to your account");return}
    DB=db;UID=id;
    const timer=setTimeout(()=>setSave("local","Account storage not reachable yet; saving in this browser"),10000);
    let got=false;
    for(const k of Object.keys(PARTS)){
      const snap=await DB.collection("data/users/"+UID).doc("ws_"+k).get();
      if(snap.exists){try{merge(JSON.parse(snap.data().j));got=true}catch(e){}}
    }
    clearTimeout(timer);
    setSave("ok",got?"Loaded from your account":"Connected: changes save to your account");
    render();
  }catch(e){setSave("local","Saved in this browser")}
}

// ================= STATUS LOGIC =================
function gateStatus(g){
  const sts=GATES[g].tests.map(n=>tRec(n).status);
  if(sts.includes("FAIL"))return "FAIL";
  if(sts.every(s=>s==="PASS"||s==="NA"))return "PASS";
  return "PENDING";
}
function overall(){
  const all=TESTS.map(t=>tRec(t.n).status);
  const gs=Object.keys(GATES).map(gateStatus);
  const failedGateTests=Object.values(GATES).flatMap(g=>g.tests).filter(n=>tRec(n).status==="FAIL");
  if(gs.includes("FAIL"))return {k:"nogo",label:"NO-GO",why:`Mandatory gate failed (Test ${[...new Set(failedGateTests)].join(", ")}). Return to manufacturer.`};
  const tested=all.filter(s=>s!=="PENDING").length;
  if(tested===0)return {k:"pend",label:"NOT ASSESSED",why:"No test results recorded yet. Record results in Tests to compute the Go/No-Go status."};
  if(all.every(s=>s==="PASS"||s==="NA"))return {k:"go",label:"GO",why:"All 30 tests passed or not applicable. Proceed to shadow billing / live use."};
  if(gs.every(s=>s==="PASS")&&all.includes("FAIL"))return {k:"cgo",label:"CONDITIONAL GO",why:"All four gates passed, but non-gate tests have failed. Close the NCRs before live billing."};
  return {k:"pend",label:"IN PROGRESS",why:`${tested} of 30 tests recorded. Gates not yet complete — not a GO.`};
}
function counts(){
  const c={PASS:0,FAIL:0,PENDING:0,NA:0};TESTS.forEach(t=>c[tRec(t.n).status]++);
  const allQ=[...OEM,...ST.custom];
  const o={answered:0,red:0,bb:0,pend:0,ok:0,partial:0};
  allQ.forEach(q=>{const r=oRec(q.id);if(r.answer.trim())o.answered++;if(r.verdict==="Red flag")o.red++;if(r.verdict==="Satisfactory")o.ok++;if(r.verdict==="Partial")o.partial++;if(isBB(r.answer))o.bb++;if(r.verdict==="Pending")o.pend++});
  const openN=OPEN.filter(p=>(ST.open[p.id]||{}).status!=="Confirmed").length;
  const evC=TESTS.filter(t=>tRec(t.n).status!=="PENDING"&&evState(t.n)==="r").length;
  const noGo=Object.values(GATES).flatMap(g=>g.tests).filter(n=>tRec(n).status==="FAIL").length;
  return {c,o,openN,evC,noGo,total:allQ.length};
}
const isBB=(s)=>/propriet|confidential|cannot (be )?(share|disclose)|not (be )?disclos|trade secret|black.?box/i.test(s||"");
function evState(n){
  const ev=tRec(n).ev||{};
  const critMissing=EVIDENCE.filter(e=>e[2]&&!ev[e[0]]).length;
  if(critMissing)return "r";
  return EVIDENCE.every(e=>ev[e[0]])?"g":"a";

const DIAG={
 meter:{what:"Error originates in the ABT/SEM meter or instrument transformers (Tier 1).",why:"Ratio or phase displacement of CT/PT, meter class at this PF/current.",where:"CT/PT certificates (phase in minutes), reference-meter comparison at the same injection.",ask:"A9 — phase displacement at 5/20/100% current; total error budget."},

 data:{what:"Missing, duplicate, zero-filled or altered blocks (Tier 3).",why:"Silent substitution, no completeness gate, poor buffering.",where:"Event log, block flags, HES reconciliation.",ask:"C1, C2 — code path on comms loss; written rules for duplicates/late/out-of-order."},
 tariff:{what:"Result contradicts the tariff rule (Tier 4).",why:"Hard-coded netting, wrong lead treatment, wrong window or TOD split.",where:"Tariff parameter screen and change log.",ask:"B1, B2, B5, B6 — show the parameter and its log."},

function analyserHTML(){

  <div class="row"><label class="f">Expected value<input type="number" step="any" id="anExp" value="26929.98"></label><label class="f">Measured value<input type="number" step="any" id="anMeas" value="27606.88"></label><label class="f">Acceptance limit (± %)<input type="number" step="any" id="anTol" value="0.05"></label>
  <label class="f">Failure category<select id="anCat">${[["comp","Summator computation"],["meter","Meter accuracy"],["data","Communication / data integrity"],["tariff","Tariff"],["cyber","Cybersecurity"],["interop","Interoperability"],["config","Configuration"],["time","Time synchronisation"]].map(o=>`<option value="${o[0]}">${o[1]}</option>`).join("")}</select></label></div>
  <div id="anOut" style="margin-top:12px"></div><p class="small muted" style="margin-top:8px">Pre-filled with the worked block: scalar method (27,606.88) vs correct vector result (26,929.98). ${tagH("ILL")}</p></div>`;

function runAnalyser(){
  const ex=parseFloat(document.getElementById("anExp").value),me=parseFloat(document.getElementById("anMeas").value),tol=parseFloat(document.getElementById("anTol").value),cat=document.getElementById("anCat").value;
  const out=document.getElementById("anOut");
  if([ex,me,tol].some(isNaN)){out.innerHTML=`<div class="err">Enter numbers in all three fields. The acceptance limit is a percentage, for example 0.05.</div>`;return}
  if(ex===0){out.innerHTML=`<div class="err">Expected value is zero, so a percentage error is undefined. Compare the absolute error against an absolute limit instead.</div>`;return}
  if(tol<0){out.innerHTML=`<div class="err">The acceptance limit cannot be negative.</div>`;return}
  const r=E.errPct(ex,me),pass=Math.abs(r.pct)<=tol,d=DIAG[cat];
  out.innerHTML=`<div class="readout"><div class="ro"><span>Absolute error</span><b>${fmt(r.abs,4)}</b></div><div class="ro ${pass?"good":"bad"}"><span>Error</span><b>${fmt(r.pct,4)} %</b></div><div class="ro ${pass?"good":"bad"}"><span>Result</span><b>${pass?"✓ PASS":"✕ FAIL"}</b></div></div>
   ${pass?`<div class="okbox" style="margin-top:10px">Within ±${tol}%. Record PASS on the test card with the evidence.</div>`:`<div class="critbox" style="margin-top:10px;display:grid;gap:4px"><div><b>What failed:</b> ${d.what}</div><div><b>Why it may have failed:</b> ${d.why}</div><div><b>Where to investigate:</b> ${d.where}</div><div><b>What to ask the OEM:</b> ${d.ask}</div></div>`}`;
}

function calcVector(){
  const v=UI.vec,errs=[];
  const rows=v.rows.map(r=>{let Q=+r.Q;if(v.mode==="pf"){if(!(r.pf>0&&r.pf<=1))errs.push(`${r.name}: PF must be between 0 and 1 (greater than 0).`);Q=E.qFromPF(+r.P,+r.pf,r.lead)}
    if(r.MF!==""&&(+r.MF<=0||isNaN(+r.MF)))errs.push(`${r.name}: MF must be a positive number.`);return {P:+r.P,Q,MF:r.MF,missing:r.missing,name:r.name}});
  const out=document.getElementById("vOut");
  if(errs.length){out.innerHTML=errs.map(e=>`<div class="err">${esc(e)}</div>`).join("");document.getElementById("vSvg").innerHTML="";return}
  const res=E.vector(rows,v.treat);
  const all=E.vector(rows.map(r=>({...r,missing:false})),v.treat);
  const anyMissing=rows.some(r=>r.missing);
  out.innerHTML=`<div class="readout"><div class="ro"><span>ΣP</span><b>${fmt(res.P)}</b></div><div class="ro"><span>ΣQ</span><b>${fmt(res.Q)}</b></div><div class="ro good"><span>S vector (correct)</span><b>${fmt(res.S)}</b></div><div class="ro"><span>PF</span><b>${fmt(res.PF,4)}</b></div><div class="ro ${res.over>0.0005?"bad":""}"><span>Scalar Σ kVA (wrong)</span><b>${fmt(res.scalar)}</b></div><div class="ro ${res.over>0.0005?"bad":""}"><span>Scalar overstatement</span><b>${fmt(res.over,2)} %</b></div></div>
   ${res.over>0.0005?`<div class="critbox" style="margin-top:10px"><b>Scalar addition overstates demand by ${fmt(res.scalar-res.S)} (${fmt(res.over,2)}%).</b> Add signed P and Q first, then compute S.</div>`:`<div class="okbox" style="margin-top:10px">Feeders are at the same angle, so scalar and vector agree here. Change one PF to see them diverge.</div>`}
   ${anyMissing?`<div class="critbox" style="margin-top:8px"><b>INVALID_INCOMPLETE.</b> A feeder is missing. The value above is what a zero-filling summator would bill (${fmt(res.S)} vs ${fmt(all.S)} with all feeders, ${fmt((res.S-all.S)/all.S*100,1)}%). Correct behaviour: flag the block, exclude it from MD, recover from meter memory.</div>`:""}
   <p class="small muted" style="margin-top:8px">If the values are 15-min block energies (kWh, kVArh), demand = S × 4. Treatment: ${{net:"lag + lead netted",lag:"lag only",abs:"lead counted as lag"}[v.treat]}.</p>`;
  // diagram
  const pts=[[0,0]];let x=0,y=0;const used=rows.filter(r=>!r.missing).map(r=>{const mf=(r.MF===""||r.MF==null)?1:+r.MF;let q=r.Q*mf;if(v.treat==="lag")q=Math.max(0,q);if(v.treat==="abs")q=Math.abs(q);return {p:r.P*mf,q,name:r.name}});
  used.forEach(u=>{x+=u.p;y+=u.q;pts.push([x,y])});
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  let x0=Math.min(0,...xs),x1=Math.max(0,...xs),y0=Math.min(0,...ys),y1=Math.max(0,...ys);
  const span=Math.max(x1-x0,(y1-y0)*1.6,1e-9);const W=760,H=Math.max(220,Math.min(420,(y1-y0)/span*W*0.9+90));
  const sx=(W-120)/span, sy=sx;
  const X=(v)=>60+(v-x0)*sx, Y=(v)=>H-40-(v-y0)*sy;
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vector diagram"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker><marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs>
   <line x1="20" x2="${W-10}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)"/><line x1="${X(0)}" x2="${X(0)}" y1="10" y2="${H-20}" stroke="var(--line)"/><text x="${W-14}" y="${Y(0)-6}" text-anchor="end">P</text><text x="${X(0)+6}" y="18">Q</text>`;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];svg+=`<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(b[0])}" y2="${Y(b[1])}" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/><text x="${(X(a[0])+X(b[0]))/2+6}" y="${(Y(a[1])+Y(b[1]))/2-6}">${esc(used[i-1].name)}</text>`}
  const e=pts[pts.length-1];svg+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(e[0])}" y2="${Y(e[1])}" stroke="var(--accent)" stroke-width="3" marker-end="url(#ahA)"/><text x="${X(e[0])}" y="${Y(e[1])+(e[1]>=0?-10:18)}" text-anchor="middle" style="fill:var(--accent);font-weight:600">S = ${fmt(res.S)}</text></svg>`;
  document.getElementById("vSvg").innerHTML=svg;
}

function calcMF(){
  const f=UI.mf,o=document.getElementById("mfOut"),errs=[];
  if(!(f.ctp>0&&f.cts>0))errs.push("CT ratio: primary and secondary must both be greater than zero.");
  if(!(f.ptp>0&&f.pts>0))errs.push("PT ratio: primary and secondary must both be greater than zero.");
  if(!(f.pf>0&&f.pf<=1))errs.push("PF must be greater than 0 and at most 1.");
  if(!(f.v>=0&&f.i>=0))errs.push("Secondary voltage and current cannot be negative.");
  if(!(f.cfgct>0))errs.push("Configured CT primary must be greater than zero.");
  if(errs.length){o.innerHTML=errs.map(e=>`<div class="err">${e}</div>`).join("")}else{
  const ctr=f.ctp/f.cts,ptr=f.ptp/f.pts,mf=ctr*ptr,sp=Math.sqrt(3)*f.v*f.i*f.pf,sq=Math.sqrt(3)*f.v*f.i*Math.sin(Math.acos(f.pf))*(f.lead?-1:1);
  const pk=sp*mf/1000,qk=sq*mf/1000,dbl=pk*mf,wrong=sp*(f.cfgct/f.cts)*ptr/1000;
  o.innerHTML=`<div class="readout"><div class="ro"><span>CT ratio</span><b>${fmt(ctr,2)}</b></div><div class="ro"><span>PT ratio</span><b>${fmt(ptr,2)}</b></div><div class="ro"><span>MF = CTR × PTR</span><b>${fmt(mf,0)}</b></div><div class="ro"><span>Secondary P (W)</span><b>${fmt(sp,2)}</b></div><div class="ro good"><span>Primary P (kW)</span><b>${fmt(pk,2)}</b></div><div class="ro"><span>Primary Q (kVAr)</span><b>${fmt(qk,2)}</b></div></div>
  <p class="small muted" style="margin-top:6px">Primary kW = secondary W × MF ÷ 1,000 (MF ÷ 1,000 = ${fmt(mf/1000,3)} kW per secondary W). P = √3 · V · I · PF.</p>
  <div class="critbox" style="margin-top:8px"><b>MF APPLIED TWICE</b> (meter and summator, or summator and HES): ${fmt(dbl,0)} kW — ${fmt(mf,0)} times too high.</div>
  ${Math.abs(f.cfgct-f.ctp)>1e-9?`<div class="critbox" style="margin-top:8px"><b>WRONG FEEDER RATIO</b> configured ${f.cfgct}/${f.cts} instead of ${f.ctp}/${f.cts}: ${fmt(wrong,2)} kW, error ${fmt((wrong-pk)/pk*100,1)}%.</div>`:`<div class="okbox" style="margin-top:8px">Configured CT ratio matches the installed CT.</div>`}`}
  const c=document.getElementById("mfChg");
  if(!(f.oldct>0&&f.newct>0)||!(f.chg>=0&&f.chg<=15)||isNaN(f.load)){c.innerHTML='<div class="err">CT ratios must be greater than zero and the change minute between 0 and 15.</div>';return}
  const s1=f.load/f.oldct,s2=f.load/f.newct; // secondary in "per-ratio" units

  const oldAll=(f.chg*s1+(15-f.chg)*s2)/15*f.oldct, newAll=(f.chg*s1+(15-f.chg)*s2)/15*f.newct;
  c.innerHTML=`<div class="readout"><div class="ro good"><span>Correct (effective-dated)</span><b>${fmt(correct,1)} kW</b></div><div class="ro bad"><span>Old ratio for whole block</span><b>${fmt(oldAll,1)} kW</b></div><div class="ro bad"><span>New ratio back-applied</span><b>${fmt(newAll,1)} kW</b></div></div>

}

function lockRisk(){

  INTEROP.forEach(i=>{tot+=i.w;const s=(ST.interop[i.id]||"Unknown");if(s==="Confirmed")ok+=i.w;else{missing++;if(s==="No"&&i.w===3)no3=true}});

  return {pct,level,missing};
}

   <button class="btn pri" data-act="expJSON">Download full backup (JSON)</button><button class="btn" data-act="expCSV">Download test results (CSV)</button><button class="btn" data-act="expOEM">Download manufacturer Q&A (CSV)</button>
   <p class="small muted">If downloads are not available in this view, the content opens in a box you can copy.</p></div></div>
  <div class="panel c6"><h3>Import</h3><label class="f">Restore from a JSON backup<input type="file" id="impFile" accept=".json,application/json"></label><div id="impMsg" style="margin-top:8px"></div>

  <div id="copyBox"></div>`;
}
function testsCSV(){
  const h=["Test","Name","Gate","Tier","Status","Expected","Measured","Limit %","Unit","Date","Observation","Manufacturer response","Corrective action","Retest","Evidence"];
  const rows=TESTS.map(t=>{const r=tRec(t.n);return [t.n,t.name,t.gate||"",t.tier,r.status,r.exp,r.meas,r.tol,r.unit,r.date,r.obs,r.oemr,r.action,r.retest,{g:"Complete",a:"Incomplete",r:"Critical missing"}[evState(t.n)]]});
  return toCSV([h,...rows]);
}
function oemCSV(){return toCSV([["ID","Category","Question","Answer","Verdict","Date","Notes","Black-box flag"],...[...OEM,...ST.custom].map(x=>{const r=oRec(x.id);return [x.id,OEM_CATS[x.cat]||x.cat,x.q,r.answer,r.verdict,r.date,r.note,isBB(r.answer)?"YES":""]})])}
const toCSV=(rows)=>rows.map(r=>r.map(c=>{const s=String(c??"");return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}).join(",")).join("\n");
async function offer(name,text){
  try{const d=window.claude&&window.claude.use?await window.claude.use("downloads"):null;if(d){await d.save({filename:name,data:text});toast("Download offered: "+name);return}}catch(e){}
  const box=document.getElementById("copyBox")||document.querySelector(".view");
  const el=document.createElement("div");el.className="panel";el.innerHTML=`<h3>${esc(name)}</h3><p class="small muted">Downloads are not available here. Select all and copy.</p><textarea style="min-height:220px;font-family:var(--font-mono);font-size:12px">${esc(text)}</textarea>`;
  box.appendChild(el);el.scrollIntoView({behavior:"smooth"});
}

// ================= DRAWER / TOAST =================
let drawerTest=null;
function drawer(title,pill,html){
  const b=document.getElementById("dBody"),same=document.getElementById("dTitle").innerHTML===title&&document.getElementById("drawer").classList.contains("show"),st=b.scrollTop;
  document.getElementById("dTitle").innerHTML=title;document.getElementById("dPill").innerHTML=pill||"";
  b.innerHTML=html;
  document.getElementById("drawer").classList.add("show");document.getElementById("scrim").classList.add("show");
  if(same)b.scrollTop=st;else{b.scrollTop=0;document.getElementById("dClose").focus()}
}
function closeDrawer(){document.getElementById("drawer").classList.remove("show");document.getElementById("scrim").classList.remove("show");drawerTest=null;render()}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}

// ================= SEARCH =================
let IDX=null;
function buildIdx(){IDX=[
 ...TESTS.map(t=>({k:"Test "+t.n,t:t.name,s:t.obj,go:()=>{UI.testTab="matrix";go("tests");openTest(t.n)}})),
 ...BENCH.map(b=>({k:"Bench "+b.id,t:b.name,s:b.reg,go:()=>{UI.testTab="bench";go("tests")}})),
 ...OEM.map(q=>({k:"Question "+q.id,t:q.q,s:q.know,go:()=>openQ(q.id)})),
 ...GLOSS.map(g=>({k:"Glossary",t:g[0],s:g[1],go:()=>{UI.gq=g[0];go("glossary")}})),
 ...EXAMPLES.map((x,i)=>({k:"Example "+(i+1),t:x.t,s:x.r,go:()=>go("examples")})),
 ...ANOM.map(a=>({k:"Anomaly",t:a.e,s:a.resp,go:()=>go("anomalies")})),
 ...SEC.map(s=>({k:"Security",t:s.area,s:s.req,go:()=>go("security")})),
 ...INTEROP.map(s=>({k:"Interoperability",t:s.t,s:"",go:()=>go("interop")})),
 ...OPEN.map(p=>({k:"Open point "+p.id,t:p.t,s:p.who,go:()=>go("billing")})),
 ...BRIEF.map(b=>({k:"Must know",t:b.t,s:b.n,go:()=>go("brief")})),
 ...WRONGS.map(w=>({k:"What can go wrong",t:w[0],s:w[1],go:()=>go("billing")}))]}
function doSearch(v){
  const box=document.getElementById("results");
  if(!v.trim()){box.classList.remove("show");box.innerHTML="";return}
  if(!IDX)buildIdx();const q=v.toLowerCase();
  const hits=[...IDX,...ST.custom.map(c=>({k:"My question "+c.id,t:c.q,s:c.know,go:()=>openQ(c.id)}))].filter(x=>(x.k+" "+x.t+" "+(x.s||"")).toLowerCase().includes(q)).slice(0,25);
  box._hits=hits;
  box.innerHTML=hits.length?hits.map((h,i)=>`<button data-hit="${i}"><div class="k">${esc(h.k)}</div><div>${esc(h.t)}</div></button>`).join(""):`<div style="padding:10px 12px" class="muted">No matches.</div>`;
  box.classList.add("show");
}
function openQ(id){UI.oemCat="ALL";UI.oemVerdict="ALL";UI.oemQ="";UI.openQ=id;go("oem");setTimeout(()=>{const el=document.getElementById("q-"+id);if(el)el.scrollIntoView({block:"center"})},40)}

const VIEWS={library:vLibrary,home:vHome,brief:vBrief,tests:vTests,oem:vOEM,labs:vLabs,examples:vExamples,quadrants:vQuad,arch:vArch,anomalies:vAnom,billing:vBilling,security:vSec,interop:vInterop,checklist:vCheck,glossary:vGloss,records:vRecords};
function go(v){if(!VIEWS[v])v="home";UI.view=v;render();window.scrollTo(0,0);try{if(location.hash!=="#"+v)history.replaceState(null,"","#"+v)}catch(e){}}
function route(){let h="";try{h=location.hash.replace("#","")}catch(e){}if(VIEWS[h]&&h!==UI.view){UI.view=h;render();window.scrollTo(0,0)}else if(!document.getElementById("view").innerHTML)render()}
function render(){
  const main=document.getElementById("view");
  const ae=document.activeElement,aid=ae&&ae.id,pos=ae&&ae.selectionStart;
  main.innerHTML=VIEWS[UI.view]();renderNav();
  if(UI.view==="tests"&&UI.testTab==="analyser")runAnalyser();
  if(UI.view==="labs")({vector:calcVector,md:calcMD,clock:calcClock,mf:calcMF,phase:calcPhase,unc:calcUnc}[UI.labTab])();
  if(aid){const el=document.getElementById(aid);if(el&&el!==document.body){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
  document.title="EHT Digital Summator Dashboard";
}
function relab(){({vector:calcVector,md:calcMD,clock:calcClock,mf:calcMF,phase:calcPhase,unc:calcUnc}[UI.labTab])()}

document.addEventListener("click",async e=>{
  const ln=e.target.closest('a[href^="#"]');if(ln){e.preventDefault();const g=ln.getAttribute("href").slice(1);if(ln.dataset.goq){closeDrawer();openQ(ln.dataset.goq)}else{if(document.getElementById("drawer").classList.contains("show"))closeDrawer();go(g)}return}
  const z=e.target.closest("[data-zoom]");if(z){zoom(z.dataset.zoom,z.dataset.cap||(z.alt||""));return}
  const lb=e.target.closest("[data-libtab],[data-deck],[data-slide],[data-goslide],[data-go]");
  if(lb){const d=lb.dataset;if(d.libtab)UI.libTab=d.libtab;if(d.deck){UI.deck=d.deck;UI.slide=1;UI.libTab="decks"}if(d.slide){const dk=MEDIA.decks.find(x=>x.id===UI.deck);UI.slide=Math.min(dk.n,Math.max(1,UI.slide+ +d.slide))}if(d.goslide)UI.slide=+d.goslide;if(d.go){go(d.go)}else render();return}
  const t=e.target.closest("[data-test],[data-ttab],[data-tgrp],[data-tst],[data-tset],[data-ltab],[data-vmode],[data-vdel],[data-vpre],[data-act],[data-ocat],[data-over],[data-delq],[data-goq],[data-quad],[data-iop],[data-hit],[data-depth],[data-thm]");
  if(!t){if(!e.target.closest(".search"))document.getElementById("results").classList.remove("show");return}
  const d=t.dataset;
  if(d.hit!==undefined){const h=document.getElementById("results")._hits[+d.hit];document.getElementById("results").classList.remove("show");document.getElementById("gsearch").value="";h.go();return}
  if(d.tset){const r=tRec(+d.tset);r.status=d.v;touch();openTest(+d.tset);renderNav();return}
  if(d.test){drawerTest=+d.test;openTest(+d.test);return}
  if(d.ttab){UI.testTab=d.ttab;render();return}
  if(d.tgrp){UI.testGrp=d.tgrp;render();return}
  if(d.tst){UI.testStatus=d.tst;render();return}
  if(d.ltab){UI.labTab=d.ltab;render();return}
  if(d.vmode){UI.vec.mode=d.vmode;UI.vec.rows.forEach(r=>{if(d.vmode==="pf"){const s=E.hyp(r.P,r.Q);r.pf=s?Math.abs(r.P)/s:1;r.pf=Math.round(r.pf*1000)/1000||1;r.lead=r.Q<0}else{r.Q=Math.round(E.qFromPF(r.P,r.pf,r.lead)*1000)/1000}});render();return}
  if(d.vdel){UI.vec.rows.splice(+d.vdel,1);render();return}
  if(d.vpre){const p=VPRESETS[d.vpre];UI.vec.mode="pq";UI.vec.rows=p.rows.map(r=>({name:r[0],P:r[1],Q:r[2],pf:0.9,lead:r[2]<0,MF:1,missing:false}));render();return}
  if(d.ocat){UI.oemCat=d.ocat;render();return}
  if(d.over){UI.oemVerdict=d.over;render();return}
  if(d.quad){UI.quad=+d.quad;render();return}
  if(d.iop){ST.interop[d.iop]=d.v;touch();render();return}
  if(d.delq){ST.custom=ST.custom.filter(c=>c.id!==d.delq);delete ST.oem[d.delq];touch();render();return}
  if(d.depth){UI.depth=+d.depth;document.body.className="d"+UI.depth;document.querySelectorAll("[data-depth]").forEach(b=>b.classList.toggle("on",+b.dataset.depth===UI.depth));try{localStorage.setItem(LS_KEY+"-depth",UI.depth)}catch(e){};return}
  if(d.thm){const th=d.thm;if(th==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",th);document.querySelectorAll("[data-thm]").forEach(b=>b.classList.toggle("on",b.dataset.thm===th));return}
  const a=d.act;
  if(a==="vAdd"){UI.vec.rows.push({name:"F"+(UI.vec.rows.length+1),P:5000,Q:1500,pf:0.958,lead:false,MF:1,missing:false});render()}
  if(a==="addQ"){const q=document.getElementById("nqQ").value.trim();if(!q){document.getElementById("nqErr").innerHTML='<span class="err">Write the question first.</span>';return}
    const n=ST.custom.length?Math.max(...ST.custom.map(c=>+c.id.slice(1)))+1:1;
    ST.custom.push({id:"M"+n,mine:true,cat:document.getElementById("nqC").value,q,why:document.getElementById("nqW").value.trim(),know:document.getElementById("nqK").value.trim(),red:document.getElementById("nqR").value.trim(),fu:document.getElementById("nqF").value.trim(),tests:document.getElementById("nqT").value.split(/[ ,;]+/).map(Number).filter(x=>x>=1&&x<=30)});
    touch();UI.openQ="M"+n;render();toast("Question M"+n+" added")}
  if(a==="copyQ"||a==="copyQA"){const txt=qText(a==="copyQA");try{await navigator.clipboard.writeText(txt);toast("Copied to clipboard")}catch(err){offer(a==="copyQ"?"questions.txt":"questions-answers.txt",txt)}}
  if(a==="print"){toast("Use your browser's print command (Ctrl/Cmd + P)")}
  if(a==="expJSON")offer("eht-summator-records.json",JSON.stringify(ST,null,2));
  if(a==="expCSV")offer("eht-summator-tests.csv",testsCSV());
  if(a==="expOEM")offer("eht-summator-manufacturer-QA.csv",oemCSV());
  if(a==="reset1"){t.textContent="Click again to confirm reset";t.dataset.act="reset2";t.classList.add("pri");return}
  if(a==="reset2"){Object.assign(ST,{tests:{},bench:{},oem:{},custom:[],stages:{FAT:"none",CPRI:"none",SAT:"none",SHADOW:"none"},open:{},sec:{},interop:{},check:{}});touch();render();toast("All records cleared")}
});
document.addEventListener("keydown",e=>{
  if(UI.view==="library"&&UI.libTab==="decks"&&!e.target.matches("input,textarea,select")&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){const dk=MEDIA.decks.find(x=>x.id===UI.deck);UI.slide=Math.min(dk.n,Math.max(1,UI.slide+(e.key==="ArrowRight"?1:-1)));render();return}
  if(e.key==="Escape"&&document.getElementById("drawer").classList.contains("show"))closeDrawer();
  if(e.key==="Enter"){const r=e.target.closest("tr[data-test]");if(r){openTest(+r.dataset.test)}const g=e.target.closest("[data-quad]");if(g){UI.quad=+g.dataset.quad;render()}}
});
function onField(e){
  const el=e.target,d=el.dataset;let v=el.type==="checkbox"?el.checked:el.value;
  if(el.id==="gsearch"){doSearch(v);return}
  if(d.trec){tRec(+d.trec)[d.f]=v;touch();
    if(["exp","meas","tol"].includes(d.f)){const r=tRec(+d.trec);let h="";if(r.exp!==""&&r.meas!==""){const x=E.errPct(+r.exp,+r.meas),tol=r.tol===""?null:+r.tol;h=`<div class="readout" style="margin-top:8px"><div class="ro"><span>Absolute error</span><b>${fmt(x.abs,4)}</b></div><div class="ro ${tol==null?"":Math.abs(x.pct)<=tol?"good":"bad"}"><span>Error</span><b>${fmt(x.pct,4)} %</b></div>${tol!=null?`<div class="ro ${Math.abs(x.pct)<=tol?"good":"bad"}"><span>Against ±${tol}%</span><b>${Math.abs(x.pct)<=tol?"Within":"Outside"}</b></div>`:""}</div>`}document.getElementById("tErr").innerHTML=h}
    return}
  if(d.tev){const r=tRec(+d.tev);r.ev=r.ev||{};r.ev[d.f]=v;touch();if(e.type==="change")openTest(+d.tev);return}
  if(d.bench){ST.bench[d.bench]=ST.bench[d.bench]||{};ST.bench[d.bench][d.f]=v;touch();if(e.type==="change")render();return}
  if(d.orec){oRec(d.orec)[d.f]=v;touch();qStatus(d.orec);if(e.type==="change"&&d.f==="verdict")renderNav();return}
  if(d.stage){ST.stages[d.stage]=v;touch();render();return}
  if(el.id==="feederN"){ST.feeders=+v;touch();return}
  if(d.open){ST.open[d.open]=ST.open[d.open]||{};ST.open[d.open][d.f]=v;touch();if(d.f==="status")render();return}
  if(d.sec){ST.sec[d.sec]=ST.sec[d.sec]||{};ST.sec[d.sec][d.f]=v;touch();if(d.f==="st")render();return}
  if(d.chk!==undefined){ST.check[d.chk]=v;touch();if(e.type==="change")render();return}
  if(el.id==="oemQ"){UI.oemQ=v;render();return}
  if(el.id==="gq"){UI.gq=v;render();return}
  if(["anExp","anMeas","anTol","anCat"].includes(el.id)){runAnalyser();return}
  if(d.vr!==undefined){const r=UI.vec.rows[+d.vr];if(d.f==="name")r.name=v;else if(d.f==="missing")r.missing=v;else if(d.f==="lead")r.lead=v==="1";else r[d.f]=v===""?"":parseFloat(v);calcVector();return}
  if(el.id==="vTreat"){UI.vec.treat=v;calcVector();return}
  if(d.md){UI.md[d.md][+d.k][+d.j]=parseFloat(v);calcMD();return}
  if(el.id==="clkOff"){UI.clk.off=+v;document.getElementById("clkV").textContent=v;calcClock();return}
  if(d.clk){UI.clk[d.clk]=parseFloat(v);calcClock();return}
  if(d.mf){UI.mf[d.mf]=d.mf==="lead"?v==="1":parseFloat(v);calcMF();return}
  if(el.id==="pePF"){UI.pe.pf=+v;document.getElementById("peV").textContent=v;calcPhase();return}
  if(d.pe){UI.pe[d.pe]=d.pe==="lead"?v==="1":parseFloat(v);calcPhase();return}
  if(d.un){UI.un[d.un]=parseFloat(v);calcUnc();return}
}
document.addEventListener("input",e=>{if(e.target.matches("select,input[type=checkbox],input[type=date],input[type=file]"))return;onField(e)});
document.addEventListener("change",e=>{
  if(e.target.id==="vidFile"){for(const f of e.target.files)UI.vids.push({n:f.name,u:URL.createObjectURL(f)});render();return}
  if(e.target.id==="impFile"){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||typeof o!=="object"||!("tests" in o))throw 0;merge(o);touch();render();document.getElementById("impMsg").innerHTML='<div class="okbox">Backup restored.</div>'}catch(err){document.getElementById("impMsg").innerHTML='<div class="err">That file is not a dashboard backup. Choose a JSON file exported from this dashboard.</div>'}};rd.readAsText(f);return}
  onField(e)});

// ================= INIT =================
function init(){
  loadLocal();
  try{const dp=+localStorage.getItem(LS_KEY+"-depth");if(dp>=1&&dp<=4)UI.depth=dp}catch(e){}
  document.body.className="d"+UI.depth;
  document.querySelectorAll("[data-depth]").forEach(b=>b.classList.toggle("on",+b.dataset.depth===UI.depth));
  document.getElementById("dClose").onclick=closeDrawer;document.getElementById("scrim").onclick=closeDrawer;
  window.addEventListener("hashchange",route);
  let h="";try{h=location.hash.replace("#","")}catch(e){}UI.view=VIEWS[h]?h:"home";render();
  setSave("local","Saved in this browser");
  initDB();
}
init();
</script>
